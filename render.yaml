services:
  - type: web
    name: flexer-store
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: FLEXER_DATA_DIR
        value: /var/data/flexer/database
      - key: FLEXER_UPLOADS_DIR
        value: /var/data/flexer/uploads
    disk:
      name: flexer-data
      mountPath: /var/data/flexer
      sizeGB: 1
