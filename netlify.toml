[build]
  command = "npm run design:build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/**", "public/build/**"]

# Cache immutable build assets
[[headers]]
  for = "/build/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# All API requests go to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200
  force = true

# HTML page routes (these don't have a physical file in public/)
# so they MUST go through the Express function.
# force = false means Netlify checks for a static file first.

[[redirects]]
  from = "/"
  to = "/.netlify/functions/server/"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/.netlify/functions/server/shop"
  status = 200

[[redirects]]
  from = "/product/*"
  to = "/.netlify/functions/server/product/:splat"
  status = 200

